version: '3.8'

services:
  # Существующие сервисы из предыдущего этапа
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smarthome
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-security.sql:/docker-entrypoint-initdb.d/init-security.sql # Новые таблицы
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smarthome"]
      interval: 10s
    networks:
      - smarthome-network

  # Legacy Monolith (из вашего docker-compose)
  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
    ports:
      - "8080:8080"
    networks:
      - smarthome-network

  # --- НОВЫЕ СЕРВИСЫ ---

  # Брокер сообщений
  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: mqtt-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
    networks:
      - smarthome-network

  # Identity Service (Java)
  identity-service:
    build: ./identity-service
    container_name: identity-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/smarthome
      - MONOLITH_URL=http://app:8080 # Для проксирования регистрации
    ports:
      - "8082:8082"
    networks:
      - smarthome-network

  # Telemetry Service (Python)
  telemetry-service:
    build: ./telemetry-service
    container_name: telemetry-service
    depends_on:
      - mqtt-broker
      - app
    environment:
      - MQTT_HOST=mqtt-broker
      - MONOLITH_URL=http://app:8080
    networks:
      - smarthome-network

  # WebSocket Service (Node.js)
  websocket-service:
    build: ./websocket-service
    container_name: websocket-service
    depends_on:
      - mqtt-broker
    ports:
      - "8084:8084"
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge